name: Release NatMech

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Which version segment to bump
        type: choice
        default: revision
        options:
          - major
          - minor
          - patch
          - revision

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CSPROJ: AnoMech/AnoMech.csproj
  INTERNAL_NAME: NatMech
  RELEASE_DIR: AnoMech/bin/x64/Release/NatMech

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Bump version
        id: bump
        shell: pwsh
        run: |
          $idx = @{ 'major' = 0; 'minor' = 1; 'patch' = 2; 'revision' = 3 }
          $bump = "${{ inputs.version_bump }}".ToLower()
          $content = Get-Content $env:CSPROJ -Raw
          $rx = '<Version>\s*([0-9]+(?:\.[0-9]+){0,3})\s*</Version>'
          $m = [regex]::Match($content, $rx)
          if (-not $m.Success) { throw "No <Version> element found in $env:CSPROJ" }
          $parts = @($m.Groups[1].Value.Split('.') | ForEach-Object { [int]$_ })
          while ($parts.Count -lt 4) { $parts += 0 }
          $i = $idx[$bump]
          $parts[$i] = $parts[$i] + 1
          for ($j = $i + 1; $j -lt 4; $j++) { $parts[$j] = 0 }
          $new = ($parts -join '.')
          $content = [regex]::Replace($content, $rx, "<Version>$new</Version>")
          [System.IO.File]::WriteAllText((Resolve-Path $env:CSPROJ).Path, $content)
          Write-Host "Bumped $bump : $($m.Groups[1].Value) -> $new"
          "version=$new" >> $env:GITHUB_OUTPUT

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build ${{ env.CSPROJ }} --configuration Release

      - name: Write repo.json
        shell: pwsh
        run: |
          $manifest = Get-Content "$env:RELEASE_DIR/$env:INTERNAL_NAME.json" -Raw | ConvertFrom-Json
          $download = "https://github.com/${{ github.repository }}/releases/latest/download/latest.zip"
          $entry = [ordered]@{}
          foreach ($key in 'Author','Name','Punchline','Description','InternalName','AssemblyVersion','RepoUrl','Tags','DalamudApiLevel','IconUrl') {
            if ($manifest.PSObject.Properties.Name -contains $key) { $entry[$key] = $manifest.$key }
          }
          $entry['ApplicableVersion'] = 'any'
          $entry['IsHide'] = $false
          $entry['IsTestingExclusive'] = $false
          $entry['DownloadLinkInstall'] = $download
          $entry['DownloadLinkTesting'] = $download
          $entry['DownloadLinkUpdate'] = $download
          $entry['LastUpdate'] = [string][DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          ConvertTo-Json -InputObject @($entry) -Depth 5 | Set-Content repo.json -Encoding utf8

      - name: Commit version bump and repo.json
        id: commit
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $env:CSPROJ repo.json
          git commit -m "Release ${{ env.INTERNAL_NAME }} v${{ steps.bump.outputs.version }}"
          git push
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: NatMech v${{ steps.bump.outputs.version }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          generate_release_notes: true
          files: ${{ env.RELEASE_DIR }}/latest.zip
          fail_on_unmatched_files: true
